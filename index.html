<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>療癒卡｜跟自己的情緒打聲招呼</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card-game">

        <div class="game-frame">


            <!-- =========================
                 上方設計視覺
            ========================== -->

            <header class="frame-header">

                <img
                    src="images/top-banner.png"
                    alt="抽一張專屬你的療癒卡，跟自己的情緒打聲招呼吧。"
                    class="top-banner"
                >

            </header>


            <!-- =========================
                 心情選擇畫面
            ========================== -->

            <section
                id="mood-screen"
                class="screen active"
            >

              <img
                src="images/mood-question.png"
                alt="現在的你，是什麼心情？"
                class="mood-question"
            >


                <div class="mood-buttons">

                    <!-- 紅色／躁動 -->

                    <button
                        class="mood-button"
                        data-mood="mood01"
                        type="button"
                    >

                        <img
                            src="images/mood-red.png"
                            alt="躁動"
                        >

                    </button>


                    <!-- 黃色／無聊 -->

                    <button
                        class="mood-button"
                        data-mood="mood02"
                        type="button"
                    >

                        <img
                            src="images/mood-yellow.png"
                            alt="無聊"
                        >

                    </button>


                    <!-- 藍色／疲累 -->

                    <button
                        class="mood-button"
                        data-mood="mood03"
                        type="button"
                    >

                        <img
                            src="images/mood-blue.png"
                            alt="疲累"
                        >

                    </button>


                    <!-- 粉色／難過 -->

                    <button
                        class="mood-button"
                        data-mood="mood04"
                        type="button"
                    >

                        <img
                            src="images/mood-pink.png"
                            alt="難過"
                        >

                    </button>

                </div>

            </section>


            <!-- =========================
                 卡片畫面
            ========================== -->

            <section
                id="card-screen"
                class="screen"
            >

               <div class="card-area">

    <div id="card" class="card">

        <div class="card-inner">

            <!-- =========================
                 卡片正面
            ========================== -->

            <div class="card-front">

                <img
                    id="card-image"
                    src=""
                    alt="療癒卡"
                >

            </div>


            <!-- =========================
                 卡片背面
            ========================== -->

            <div class="card-back">

                <!-- 設計師製作的卡背圖片 -->

                <img
                    id="card-back-image"
                    src=""
                    alt="療癒卡背面"
                >


                <!-- 疊在卡背圖片上的功能按鈕 -->

                <div class="card-back-content">

                    <a
                        id="pdf-link"
                        class="pdf-button"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        📖 看看這組完整卡牌
                    </a>


                    <button
                        id="draw-again"
                        class="action-button"
                        type="button"
                    >
                        ↻ 再抽一張
                    </button>


                    <button
                        id="change-mood"
                        class="action-button secondary"
                        type="button"
                    >
                        ← 換個心情
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- 翻牌提示 -->

    <p class="flip-hint">
        再點一下卡牌，看看後面藏了什麼！
    </p>

</div>


                            <!-- =========================
                                 卡片背面
                            ========================== -->

                            <div class="card-back">

                                <!-- 設計師製作的卡背 -->

                                <img
                                    id="card-back-image"
                                    src=""
                                    alt="療癒卡背面"
                                >


                                <!-- 功能按鈕 -->

                                <div class="card-back-content">


                                    <!-- 完整卡牌 PDF -->

                                    <a
                                        id="pdf-link"
                                        class="pdf-button"
                                        href="#"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        📖 看看這組完整卡牌
                                    </a>


                                    <!-- 再抽一張 -->

                                    <button
                                        id="draw-again"
                                        class="action-button"
                                        type="button"
                                    >
                                        ↻ 再抽一張
                                    </button>


                                    <!-- 換個心情 -->

                                    <button
                                        id="change-mood"
                                        class="action-button secondary"
                                        type="button"
                                    >
                                        ← 換個心情
                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </section>


            <!-- =========================
                 下方設計視覺
            ========================== -->

            <footer class="frame-footer">

                <img
                    src="images/footer-banner.png"
                    alt="今天就是那一天，無時無刻都可以正念練習！"
                    class="footer-banner"
                >

            </footer>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
